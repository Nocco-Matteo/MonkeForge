# MonkeForge configuration example.
# Copy this file to monkeforge.yaml for a local configuration.
# Precedence: real environment variables > monkeforge.yaml > .env > code defaults
# (where any remain). agents.*: both model: and cmd: required — no code defaults.
# Keep secrets (tokens, credentials, private paths) out of this file.

# Target git repo(s). There is NO default (cwd / git root is NOT used).
# Precedence:
#   1. CLI --repo <label|path|index>
#   2. PIPELINE_REPO env (or pipeline.repo below, bridged into that env)
#   3. this `repos:` list — 1 entry = auto; N>1 = CLI numbered picker
# Paths may be absolute or relative to this MonkeForge root.
# repos:
#   - path: ../mf-lab/apps/app-npm-vitest
#     label: app-npm-vitest
#   - path: ../mf-lab/apps/app-pytest-hello
#     label: app-pytest-hello
#   # or a bare string (label = basename):
#   # - /abs/path/to/my-app

pipeline:
  # Single-repo shorthand (bridged to PIPELINE_REPO). Prefer `repos:` when you
  # want a choosable list.
  # repo: /abs/path/to/my-app
  # Repository-relative architecture documents passed to the agents.
  arch_docs: []
  # Example (uncomment and list repo-relative paths to opt in):
  # arch_docs:
  #   - AGENTS.md
  #   - ARCHITECTURE.md

  # Adaptive effort default. The CLI --effort flag overrides this per run.
  effort_default: troop-monke

  # A changed file matching one of these names receives the barrel hint.
  # Separate entries with semicolons.
  # effort_critical_paths: "config.py;graph.py;state.py;run.py"

  # Existing pipeline limits. These are also available as PIPELINE_* env vars.
  max_debate_rounds: 2
  max_fix_cycles: 2
  max_test_fixes: 2
  max_intake_rounds: 4

  # Set to true for graph-only execution; agents are stubbed in dry-run mode.
  dry_run: false

  # --- Test-gate tuning (false-positive suppression) -----------------------
  # LINT rules whose violations are "known debt": if the same rule was present
  # in the baseline (any file), new occurrences in other files are NOT counted
  # as new failures. Stops pre-existing debt from looking like a batch
  # regression when it surfaces (type-aware rules) or is relocated to a new
  # file. A rule NOT in baseline in any file is still a real regression.
  # lint_debt_rules:
  #   - "@typescript-eslint/no-explicit-any"
  #   - "react-refresh/only-export-components"
  #   - "react-hooks/immutability"
  #   - "react-hooks/set-state-in-effect"
  #   - "react-hooks/purity"

  # Vitest FAIL key substrings for environment-sensitive tests (DB-gated,
  # network, external services). A failure matching any pattern is NOT counted
  # as new — it was skipped in baseline (env down) and fails when the env
  # comes up mid-batch. Declare only tests you know are ambient.
  # test_ambient_patterns:
  #   - "magic auto-grant: class domain & patron spells"

# Effort presets:
#   scout-monke  = leggero: implement + review, no debate, no gate
#   troop-monke  = medio (default): implement + review + debate
#   barrel-monke = pesante: implement + review + multi-round debate + gates
# Gate modes: off | standard | full. Standard and full currently both run
# all gates applicable to the task; full reserves the stricter future policy.
effort:
  scout-monke:
    debate_rounds: 0
    gates: "off"
    fix_cycles: 1
  troop-monke:
    debate_rounds: 2
    gates: standard
    fix_cycles: 2
  barrel-monke:
    debate_rounds: 3
    gates: full
    fix_cycles: 3

# REQUIRED. Every role must declare BOTH `model:` and `cmd:`. There are NO
# built-in defaults in code — not for models, not for CLI templates. Missing
# entries fail at import (CLI prints `error:`, no traceback).
#
# Placeholders in cmd: {model} {prompt} {prompt_file} {docs_dir}.
# Both {prompt} and {prompt_file} are always filled if present; pick ONE per
# cmd based on what your CLI accepts (do not pass both "for safety"):
#   {prompt_file}  — CLI has a file flag (e.g. devin --prompt-file …).
#                    Prefer for long steps (propose / debate / impl).
#   {prompt}       — CLI wants inline text (e.g. cursor-agent/claude/gemini
#                    -p …). Prompts >~32k are moved to stdin automatically.
# The prompt .md is always written under docs/.../prompts/ either way.
# Values below are EXAMPLES only — pick the models/CLIs you actually run.
agents:
  INTERVIEWER:
    model: gemini-3.1-pro-preview
    cmd: "gemini -m {model} --include-directories {docs_dir} -p {prompt}"
  PROPOSER:
    model: glm-5.2
    cmd: "stdbuf -oL devin --model {model} --prompt-file {prompt_file} -p --permission-mode dangerous --respect-workspace-trust false"
  PLAN_REVIEWER:
    model: codex
    cmd: "stdbuf -oL devin --model {model} --prompt-file {prompt_file} -p --permission-mode dangerous --respect-workspace-trust false"
  IMPLEMENTER:
    model: glm-5.2
    cmd: "stdbuf -oL devin --model {model} --prompt-file {prompt_file} -p --permission-mode dangerous --respect-workspace-trust false"
  CODE_REVIEWER:
    model: codex
    cmd: "stdbuf -oL devin --model {model} --prompt-file {prompt_file} -p --permission-mode dangerous --respect-workspace-trust false"
  UX_REVIEWER:
    model: gemini-3.6-flash
    cmd: "gemini -m {model} --include-directories {docs_dir} -p {prompt}"
  VISUAL_REVIEWER:
    model: sonnet
    cmd: "claude -p {prompt} --model {model} --add-dir {docs_dir}"
  VISUAL_FIXER:
    model: sonnet
    cmd: "claude -p {prompt} --model {model} --add-dir {docs_dir}"
  SUMMARIZER:
    model: glm-5.2
    cmd: "stdbuf -oL devin --model {model} --prompt-file {prompt_file} -p --permission-mode dangerous --respect-workspace-trust false"
  JUDGE:
    model: sonnet
    cmd: "claude -p {prompt} --model {model} --add-dir {docs_dir}"

# Optional condenser: keep_recent + per-role token budgets. Read directly by
# config.py from this yaml key (no env bridge — yaml is the only source).
# When a role's debate history exceeds its budget (estimated tokens), older
# rounds collapse to one-line markers. Unset role = no condensing for that
# role. keep_recent = how many latest rounds stay verbatim.
# condenser:
#   keep_recent: 2          # keep last 2 rounds verbatim, collapse older ones
#   PLAN_REVIEWER: 3000     # fires ~round 3-4, before signal-to-noise degrades
#   PROPOSER: 3000
#   UX_REVIEWER: 3000

# Optional tool settings.
# tools:
#   gemini_trust_workspace: true

# Test suites for the in-graph test gate. Read directly by config.py from
# this top-level `test_suites:` key (NOT bridged via PIPELINE_* env). Each
# entry is a mapping with: label, cwd (repo-relative), runner, and optional
# cmd (for `script`) / env (per-suite override map applied on top of
# os.environ). Runners: `npm-vitest` (tsc + vitest + lint), `pytest`
# (`python -m pytest -q`), `script` (custom cmd). An absent/empty
# `test_suites:` key triggers discovery + (on a TTY) an interactive ask on
# the first run_repo_tests() call; it does NOT silently disable the gate.
# A non-zero subprocess exit with zero parsed failures appends a synthetic
# `label|<runner> exit N` key so a crash can never silently yield a green
# gate. The legacy PIPELINE_TEST_SUITES env var (label:subdir:ENV=val) is a
# debug-only override that wins over this yaml and parses into npm-vitest
# suites.
# test_suites:
#   - label: backend
#     cwd: backend
#     runner: npm-vitest
#     env:
#       DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5433/yourdb?schema=public
#   - label: frontend
#     cwd: frontend
#     runner: npm-vitest
#   - label: python
#     cwd: ""
#     runner: pytest
#   - label: custom
#     cwd: tools
#     runner: script
#     cmd: ["bash", "run-checks.sh"]

# Optional notification settings.
# level: milestones (default) | all (debug opt-in) | silent (never push)
# notifications:
#   level: milestones
#   rate: 30
#   window: 60
