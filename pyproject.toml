[project]
name = "pipeline-graph"
version = "0.1.0"
description = "Multi-agent development pipeline as a LangGraph"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.2",
  "langgraph-checkpoint-sqlite>=1.0",
  "rich>=13.7",
  "playwright>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pipeline_graph", "pipeline_graph.nodes", "pipeline_graph.eyes"]

[tool.setuptools.package-data]
pipeline_graph = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = false
warn_unused_configs = true
explicit_package_bases = true
# Gradual: only check our own package, not tests or third-party stubs
files = ["pipeline_graph"]
exclude = ["notify_daemon\\.py"]
# Relax strictness for now — the codebase uses untyped dict state everywhere
check_untyped_defs = false
disallow_untyped_defs = false
